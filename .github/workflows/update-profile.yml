name: Update profile activity

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install contribution dependencies
        run: pip install -r scripts/requirements.txt
      - name: Fetch and render contribution graph
        env:
          GITHUB_USERNAME: MateusMenezes02
        run: |
          python scripts/fetch_contributions.py
          python scripts/render_heatmap_svg.py
      - name: Commit changes when needed
        run: |
          git diff --quiet || (git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com" && git add data/contributions.json assets/heatmap-dark.svg assets/heatmap-light.svg && git commit -m "chore: refresh contribution graph [skip ci]" && git push)
